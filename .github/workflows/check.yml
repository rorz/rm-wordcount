name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test text reader and counting
        run: npm test
      - name: Check generated Unicode table
        run: |
          python3 scripts/generate_unicode.py
          git diff --exit-code -- src/unicode.mjs
      - name: Build pinned QMLDiff
        env:
          QMD_CHECKOUT: ${{ runner.temp }}/qmldiff
        run: |
          git init "$QMD_CHECKOUT"
          git -C "$QMD_CHECKOUT" remote add origin https://github.com/asivery/qmldiff.git
          git -C "$QMD_CHECKOUT" fetch --depth=1 origin 25681c3cc7addb93fdbb41ceac1f1bdce8b2625d
          git -C "$QMD_CHECKOUT" checkout --detach FETCH_HEAD
          cargo build --release --locked --manifest-path "$QMD_CHECKOUT/Cargo.toml"
      - name: Test firmware adapters
        env:
          QMLDIFF: ${{ runner.temp }}/qmldiff/target/release/qmldiff
        run: npm run test:patch
      - name: Test QML and worker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
          python3 -m pip install PySide6-Essentials==6.8.3
          python3 scripts/test_qt.py
      - name: Build and verify release artifacts
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rm-wordcount
          path: dist/
          if-no-files-found: error
